
<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMANUEL TV</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #080d18;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  background: #101c32;
  padding: 20px;
  text-align: center;
  border-bottom: 2px solid #168cff;
}
header h1 {
  color: #168cff;
  margin: 0;
}
header p { color: #b8c9e6; }
main { padding: 18px; }
h2 { color: #168cff; }
.video-box {
  background: #14223a;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 15px;
}
video {
  width: 100%;
  border-radius: 8px;
  background: black;
}
footer {
  text-align: center;
  padding: 20px;
  color: #91a4c2;
}
</style>
</head>
<body>

<header>
  <h1>AMANUEL TV</h1>
  <p>Welcome to Amanuel TV</p>
</header>

<main>
  <h2>🎬 ቪዲዮዎች</h2>

  <div class="video-box">
    <video controls>
      <source src="video.mp4" type="video/mp4">
    </video>
    <p>የመጀመሪያ ቪዲዮ</p>
  </div>

  <p>በቅርቡ ተጨማሪ ቪዲዮዎች ይጨመራሉ።</p>
</main>

<footer>
  © 2026 AMANUEL TV
</footer>

</body>
</html>
