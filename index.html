
<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMANUEL TV</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #080d18;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  background: #101c32;
  padding: 20px;
  text-align: center;
  border-bottom: 2px solid #168cff;
}
header h1 {
  color: #168cff;
  margin: 0;
}
header p { color: #b8c9e6; }
main { padding: 18px; }
h2 { color: #168cff; }
.video-box {
  background: #14223a;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 15px;
}
video {
  width: 100%;
  border-radius: 8px;
  background: black;
}
footer {
  text-align: center;
  padding: 20px;
  color: #91a4c2;
}
</style>
</head>
<body>

<header>
  <h1>AMANUEL TV</h1>
  <p>Welcome to Amanuel TV</p>
</header>

<main>
  <h2>🎬 ቪዲዮዎች</h2>

  <div class="video-box">
    <video controls>
      <source src="video.mp4" type="video/mp4">
    </video>
    <p>የመጀመሪያ ቪዲዮ</p>
  </div>

  <p>በቅርቡ ተጨማሪ ቪዲዮዎች ይጨመራሉ።</p>
<div class="video-box">
  <h2>🎬 ቪዲዮ 1</h2>
  <iframe
    src="https://player.cloudinary.com/embed/?cloud_name=wkmfiab5&public_id=qhv0gfethzxxemburwkk"
    width="100%" height="250"
    allowfullscreen>
  </iframe>
</div>

<div class="video-box">
  <h2>🎬 ቪዲዮ 2</h2>
  <iframe
    src="https://player.cloudinary.com/embed/?cloud_name=wkmfiab5&public_id=yhflwmpn9siir4llkkzm"
    width="100%" height="250"
    allowfullscreen>
  </iframe>
</div>
</main>

<footer>
  © 2026 AMANUEL TV
</footer>
<section class="video-box">
  <h2>📤 ቪዲዮ ጫን</h2>

  <input type="file" id="videoFile"
    accept="video/mp4,video/quicktime,video/webm">

  <button id="uploadBtn">Upload</button>

  <p id="uploadStatus"></p>
  <div id="uploadedVideo"></div>
</section>

<script>
const cloudName = "wkmfiab5";
const uploadPreset = "amanueltv_upload";

document.getElementById("uploadBtn").onclick = async function() {
  const file = document.getElementById("videoFile").files[0];
  const status = document.getElementById("uploadStatus");
  const button = this;

  if (!file) {
    status.textContent = "ቪዲዮ ምረጥ።";
    return;
  }

  const data = new FormData();
  data.append("file", file);
  data.append("upload_preset", uploadPreset);

  button.disabled = true;
  status.textContent = "በመጫን ላይ...";

  try {
    const response = await fetch(
      `https://api.cloudinary.com/v1_1/${cloudName}/video/upload`,
      { method: "POST", body: data }
    );

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error?.message || "Upload failed");
    }

    const video = document.createElement("video");
    video.controls = true;
    video.src = result.secure_url;
    video.style.width = "100%";

    document.getElementById("uploadedVideo").appendChild(video);
    status.textContent = "ቪዲዮው ተጫኗል።";

  } catch (error) {
    status.textContent = "ስህተት፦ " + error.message;
  } finally {
    button.disabled = false;
  }
};
</script>
</body>
</html>
